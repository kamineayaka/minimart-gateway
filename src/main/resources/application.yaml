spring:
  application:
    name: gateway
  config:
    import:
      - optional:nacos:minimart-common.yaml?group=MINIMART
      - optional:nacos:${spring.application.name}.yaml?group=MINIMART
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        namespace: ${NACOS_NS:dev}
        group: MINIMART
      config:
        namespace: ${NACOS_NS:dev}
        group: MINIMART
        file-extension: yaml
    gateway:
      server:
        webmvc:
          discovery:
            locator:
              enabled: false
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                exposedHeaders:
                  - X-Correlation-Id
          routes:
            - id: member-service
              uri: lb://member-service
              predicates:
                - Path=/member/**
              filters:
                - StripPrefix=1
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/product/**
              filters:
                - StripPrefix=1
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/order/**
              filters:
                - StripPrefix=1
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/payment/**
              filters:
                - StripPrefix=1

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

minimart:
  gateway:
    rate-limit:
      enabled: true
      permits-per-second: 100
