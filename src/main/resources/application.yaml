spring:
  application:
    name: gateway
  jackson:
    default-property-inclusion: non_null
  cloud:
    compatibility-verifier:
      enabled: true
    gateway:
      server:
        webmvc:
          discovery:
            locator:
              enabled: false
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                exposedHeaders:
                  - X-Correlation-Id
          routes:
            - id: member-service
              uri: http://${minimart.services.member.host:member-service}:${minimart.services.member.port:8081}
              predicates:
                - Path=/member/**
              filters:
                - StripPrefix=1
            - id: product-service
              uri: http://${minimart.services.product.host:product-service}:${minimart.services.product.port:8082}
              predicates:
                - Path=/product/**
              filters:
                - StripPrefix=1
            - id: order-service
              uri: http://${minimart.services.order.host:order-service}:${minimart.services.order.port:8083}
              predicates:
                - Path=/order/**
              filters:
                - StripPrefix=1
            - id: payment-service
              uri: http://${minimart.services.payment.host:payment-service}:${minimart.services.payment.port:8084}
              predicates:
                - Path=/payment/**
              filters:
                - StripPrefix=1

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"

minimart:
  services:
    member:
      host: member-service
      port: 8081
    product:
      host: product-service
      port: 8082
    order:
      host: order-service
      port: 8083
    payment:
      host: payment-service
      port: 8084
  gateway:
    rate-limit:
      enabled: true
      permits-per-second: 100
